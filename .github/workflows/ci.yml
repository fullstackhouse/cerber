name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # package.json says Node 20+, so 20 is tested and not merely claimed. 22 is
    # what the maintainers run; the release job builds on it.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Every green merge to main releases: semantic-release reads the conventional
  # commits since the last tag, bumps the version, tags, writes the GitHub
  # release notes, and publishes to npm over OIDC. Commits that change nothing
  # users can see (chore/docs/refactor/test) release nothing.
  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      # The ruleset on main requires a pull request, and the bump commit is the one
      # push that cannot come from one. GITHUB_TOKEN can never be excused from it:
      # GitHub Actions is not an installable app, so it cannot be a ruleset bypass
      # actor at all (the API rejects it outright). A dedicated app can — installed
      # on this repo alone, listed as the single bypass actor, and minted fresh here
      # so the credential that may push to main expires with the job rather than
      # sitting in the repo's secrets. Everything semantic-release touches on GitHub
      # rides this token, which is why the job needs no `contents`/`issues`/
      # `pull-requests` permissions of its own any more.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install latest npm for OIDC support
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
